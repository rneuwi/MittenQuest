# Publishes a version: builds the addon zip, uploads it to CurseForge (X-Curse-Project-ID in
# the .toc + CF_API_KEY secret) and attaches it to the GitHub release.
#
# Runs automatically when a tag like v0.9.0-beta is pushed, which includes creating a release
# with a new tag on GitHub's Releases page. Can also be run by hand from the Actions tab for
# an existing tag. Tags containing "beta"/"alpha" are published as Beta/Alpha files.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish (e.g. v0.9.0-beta)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: BigWigsMods/packager@v2
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
