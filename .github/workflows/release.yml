# Push a tag like v0.9.0 to build the addon zip and publish it.
# GitHub release: always. CurseForge: add "## X-Curse-Project-ID: <id>" to the .toc and a
# CF_API_KEY repository secret. Wago: "## X-Wago-ID: <id>" + WAGO_API_TOKEN secret.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: BigWigsMods/packager@v2
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
