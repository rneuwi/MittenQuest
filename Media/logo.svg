<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="70%">
      <stop offset="0" stop-color="#21406b"/>
      <stop offset="1" stop-color="#0b1626"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd86b"/>
      <stop offset="0.55" stop-color="#f2b233"/>
      <stop offset="1" stop-color="#c47f12"/>
    </linearGradient>
    <linearGradient id="cuff" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fd2ff"/>
      <stop offset="1" stop-color="#1b8fc4"/>
    </linearGradient>
  </defs>

  <!-- badge -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#f2b233" stroke-width="10" opacity="0.9"/>

  <!-- dashed route trail, ending in a waypoint -->
  <path d="M86 418 C 120 360, 70 300, 118 250 S 120 150, 160 118"
        fill="none" stroke="#3fd2ff" stroke-width="12" stroke-linecap="round" stroke-dasharray="2 26" opacity="0.85"/>
  <circle cx="160" cy="112" r="16" fill="#3fd2ff"/>

  <!-- mitten: thumb + hand body -->
  <g transform="translate(-12,0)">
  <g stroke="#3a2205" stroke-width="10" stroke-linejoin="round">
    <path d="M232 268 C 196 252, 168 214, 176 184 C 184 156, 214 152, 236 176 L 262 206 Z" fill="url(#gold)"/>
    <path d="M226 384 L 222 214 C 220 140, 262 98, 316 98 C 372 98, 404 142, 400 210 L 392 384 Z" fill="url(#gold)"/>
    <!-- cuff -->
    <rect x="208" y="370" width="200" height="66" rx="18" fill="url(#cuff)"/>
  </g>
  <!-- cuff knit stripes -->
  <g stroke="#0b1626" stroke-width="7" stroke-linecap="round" opacity="0.45">
    <line x1="246" y1="382" x2="246" y2="424"/>
    <line x1="284" y1="382" x2="284" y2="424"/>
    <line x1="322" y1="382" x2="322" y2="424"/>
    <line x1="360" y1="382" x2="360" y2="424"/>
  </g>

  <!-- quest "!" on the mitten -->
  <g fill="#0b1626">
    <path d="M296 148 h40 l-8 132 h-24 Z"/>
    <circle cx="316" cy="318" r="22"/>
  </g>
  </g>
</svg>
